<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Dashboard</title>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = { theme: { extend: {
    colors: { bg:'#0B0F14', surface:'#111826', line:'#22303F', cyan:'#00E5C7', violet:'#7C5CFF', ink:'#E6EAF2', muted:'#8A93A6' },
    fontFamily: { mono:['"JetBrains Mono"','monospace'], display:['"Space Grotesk"','sans-serif'], body:['Inter','sans-serif'] },
  }}};
</script>
<link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body class="bg-bg text-ink font-body min-h-screen">

<header class="border-b border-line">
  <nav class="max-w-5xl mx-auto px-6 py-4 flex items-center justify-between">
    <span class="font-mono text-sm"><span class="text-cyan">~/</span>admin</span>
    <div class="flex items-center gap-4">
      <a href="{{ url_for('index') }}" class="font-mono text-xs text-muted hover:text-cyan transition-colors">view site ↗</a>
      <form method="POST" action="{{ url_for('admin.logout') }}">
        <input type="hidden" name="csrf_token" value="{{ csrf_token if csrf_token else '' }}">
        <button type="submit" class="font-mono text-xs text-muted hover:text-amber transition-colors">logout</button>
      </form>
    </div>
  </nav>
</header>

<main class="max-w-5xl mx-auto px-6 py-12">
  <h1 class="font-display text-2xl font-600 mb-8">Content</h1>

  <div class="grid sm:grid-cols-2 lg:grid-cols-3 gap-4">
    <a href="{{ url_for('admin.profile') }}" class="rounded-lg border border-line bg-surface/60 p-5 hover:border-cyan/50 transition-colors">
      <p class="font-display font-600 mb-1">Profile</p>
      <p class="font-mono text-xs text-muted">Hero, about, stats, links</p>
    </a>
    {% for key, cfg in entities.items() %}
    <a href="{{ url_for('admin.list_entity', entity=key) }}" class="rounded-lg border border-line bg-surface/60 p-5 hover:border-cyan/50 transition-colors">
      <p class="font-display font-600 mb-1">{{ cfg.label }}</p>
      <p class="font-mono text-xs text-muted">{{ counts[key] }} record{{ 's' if counts[key] != 1 else '' }}</p>
    </a>
    {% endfor %}
  </div>
</main>

</body>
</html>
